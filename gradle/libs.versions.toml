[versions]
agp = "9.2.1"
kotlin = "2.1.21"
coreKtx = "1.15.0"
appcompat = "1.7.1"
material = "1.14.0"
grpcStub = "1.82.1"
grpcAndroid = "1.82.1"
grpcKotlin = "1.4.1"
protobuf = "4.35.1"
protobufPlugin = "0.10.0"
coroutines = "1.11.0"
ksp = "2.1.21-2.0.2"
kogenDi = "1.0.8"
constraintLayout = "2.2.1"
composeBom = "2024.12.01"
activityCompose = "1.9.3"
lifecycleViewmodel = "2.8.7"
koGenNavigation = "1.0.1"
navigation = "2.8.4"
runtime = "1.11.4"
core = "1.15.0"
room = "2.8.4"
coil = "2.6.0"
jreleaser = "1.14.0"
junit = "4.13.2"
mockk = "1.13.13"
turbine = "1.2.0"
truth = "1.4.4"
orgJson = "20240303"
zoomable = "2.8.0"
media3 = "1.11.0"
okhttp = "4.12.0"
ktor = "3.0.3"
retrofit = "2.11.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
grpc-stub = { group = "io.grpc", name = "grpc-stub", version.ref = "grpcStub" }
grpc-protobuf = { group = "io.grpc", name = "grpc-protobuf-lite", version.ref = "grpcAndroid" }
grpc-android = { group = "io.grpc", name = "grpc-android", version.ref = "grpcAndroid" }
grpc-okhttp = { group = "io.grpc", name = "grpc-okhttp", version.ref = "grpcAndroid" }
grpc-kotlin-stub = { group = "io.grpc", name = "grpc-kotlin-stub", version.ref = "grpcKotlin" }
protobuf = { group = "com.google.protobuf", name = "protobuf-kotlin-lite", version.ref = "protobuf" }
coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kogen-di = { group = "io.github.eugenprog", name = "android-di", version.ref = "kogenDi" }
kogen-di-compiler = { group = "io.github.eugenprog", name = "android-di-compiler", version.ref = "kogenDi" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintLayout" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleViewmodel" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodel" }
androidx-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "runtime" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
koGenNavigation = { group = "io.github.eugenprog", name = "navigation-compose", version.ref = "koGenNavigation" }
koGenNavigationCompiler = { group = "io.github.eugenprog", name = "navigation-compose-compiler", version.ref = "koGenNavigation" }
androidx-navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
coil-base = { group = "io.coil-kt", name = "coil-compose-base", version.ref = "coil" }
coil = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
zoomable = { group = "net.engawapg.lib", name = "zoomable", version.ref = "zoomable" }
coil-video = { group = "io.coil-kt", name = "coil-video", version.ref = "coil" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
# CIO, not ktor-client-okhttp: the app module already exercises the OkHttp path via
# GiraffeOkHttpInterceptor, so its Ktor client needs an engine that genuinely doesn't go through
# OkHttp underneath - otherwise "test the Ktor integration" would silently just be OkHttp again.
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
jreleaser = { id = "org.jreleaser", version.ref = "jreleaser" }
