name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run tests
        run: ./gradlew :giraffe:testDebugUnitTest :app:testDebugUnitTest

      - name: Build both app variants (verifies giraffe-no-op's API stays a drop-in for the real module)
        run: ./gradlew :app:assembleDebug :app:assembleRelease
