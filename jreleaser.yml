project:
  name: Giraffe
  description: Android gRPC traffic interceptor and in-app debug viewer
  authors:
    - Eugen Kopp
  license: Apache-2.0
  inceptionYear: '2026'
  languages:
    java:
      groupId: 'io.github.eugenprog'

release:
  github:
    # Тег для релиза создаётся и пушится вручную (только у Admin-роли есть
    # право создавать теги - см. repository ruleset "Protect all tags").
    # Без skipTag JReleaser сам форсированно пересоздаёт тег (подписанный,
    # под тем же именем) от имени CI-токена, что GitHub блокирует как
    # попытку создания защищённого тега.
    skipTag: true

# Настройки GPG-подписи
signing:
  active: ALWAYS
  pgp:
    armored: true

# Настройки загрузки в Maven Central
deploy:
  maven:
    mavenCentral:
      sonatype:
        active: 'ALWAYS'
        stagingRepositories:
          - 'giraffe/build/staging-deploy'
          - 'giraffe-no-op/build/staging-deploy'
        url: 'https://central.sonatype.com/api/v1/publisher'
        namespace: 'io.github.eugenprog'
        # PomChecker (внутренняя проверка JReleaser) не понимает packaging=aar
        # у Android-библиотек и падает на этапе валидации. Центральный портал
        # Sonatype это принимает нормально, поэтому отключаем локальную проверку.
        # https://github.com/jreleaser/jreleaser.github.io/issues/85
        verifyPom: false
